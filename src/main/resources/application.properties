spring.application.name=koshly


# Cloud Run sets PORT; locally it's 8080
server.port=${PORT:8080}

# Never show stack traces or internal messages to callers
server.error.include-stacktrace=never
server.error.include-message=never
spring.mvc.problemdetails.enabled=true

# Only the health check is public from Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Your own settings
# Firebase project whose login tokens are accepted
koshly.firebase.project-id=${FIREBASE_PROJECT_ID:koshly-dev}
# Fixed by Google for every Firebase project (who issued the token, and Google's public keys)
koshly.firebase.issuer-uri=https://securetoken.google.com/${koshly.firebase.project-id}
koshly.firebase.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
koshly.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}