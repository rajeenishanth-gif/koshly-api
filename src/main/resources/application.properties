spring.application.name=koshly


# Cloud Run sets PORT; locally it's 8080
server.port=${PORT:8080}

# Never show stack traces or internal messages to callers
server.error.include-stacktrace=never
server.error.include-message=never
spring.mvc.problemdetails.enabled=true

# Only the health check is public from Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Your own settings
# Firebase project whose login tokens are accepted
# Data region this deployment serves (us now; an India deployment would use "in").
koshly.region=${KOSHLY_REGION:us}

koshly.firebase.project-id=${FIREBASE_PROJECT_ID:koshly-dev}
# Fixed by Google for every Firebase project (who issued the token, and Google's public keys)
koshly.firebase.issuer-uri=https://securetoken.google.com/${koshly.firebase.project-id}
koshly.firebase.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
koshly.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

# One Koshly account per country: the Firebase tenant a user signs in through
# decides the country (Firebase Console -> Authentication -> Settings -> Tenants,
# after upgrading to Identity Platform). Until tenants exist, everyone is in the
# default country.
koshly.accounts.tenants.US=${FIREBASE_TENANT_US:}
koshly.accounts.tenants.CA=${FIREBASE_TENANT_CA:}
koshly.accounts.tenants.IN=${FIREBASE_TENANT_IN:}
koshly.accounts.default-country=${KOSHLY_DEFAULT_COUNTRY:US}
# Countries open to users. An admin switches them in Firestore (config/app.enabledCountries,
# see AppSwitches) without a redeploy; this list applies when that document has no list,
# or Firestore can't be read. Launching in the US.
koshly.accounts.enabled-countries=${KOSHLY_ENABLED_COUNTRIES:US}
# Read config/app from Firestore (cached this long per instance). Off in tests.
koshly.app-config.firestore=${KOSHLY_APP_CONFIG_FIRESTORE:true}
koshly.app-config.refresh=PT1M
# Defaults for config/app.requireSubscription and requirePhoneVerification when the document
# doesn't set them. Both off: billing and text messages aren't live yet.
koshly.app-config.require-subscription=${KOSHLY_REQUIRE_SUBSCRIPTION:false}
koshly.app-config.require-phone-verification=${KOSHLY_REQUIRE_PHONE:false}
# The free tier (no plan, while requireSubscription is on): added by hand only, home country only,
# at most this many of each. A plan lifts the limits and adds bank linking.
koshly.free-tier.bank-accounts=1
koshly.free-tier.credit-cards=2
koshly.free-tier.loans=1

# Removed accounts disappear at once and are deleted for good after this many days.
koshly.retention.removed-account-days=30
# Clean-up time (second minute hour day month weekday, UTC): every night at 03:30.
koshly.retention.cleanup-cron=0 30 3 * * *

# Per-person API limits (requests per minute) against bots and runaway clients; over
# the limit the API answers 429 with Retry-After. Each Cloud Run instance counts on its own.
koshly.rate-limit.reads-per-minute=${KOSHLY_RATE_LIMIT_READS:120}
koshly.rate-limit.writes-per-minute=${KOSHLY_RATE_LIMIT_WRITES:30}

# --- Database ---
# Running locally: POSTGRES_* values are read from the .env file (never committed).
# In Docker and the cloud: DB_URL, DB_USER and DB_PASSWORD are set as environment variables instead.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
spring.datasource.username=${DB_USER:${POSTGRES_USER}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}

# Tables change only through Flyway migrations (src/main/resources/db/migration), never automatically
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Small pool: the starter Cloud SQL instance (db-f1-micro) allows about 25 connections in total,
# shared by every Cloud Run instance.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Cloud Run stops instances with a signal: finish requests in progress first.
server.shutdown=graceful

# --- One-time codes (Add a country, phone verification) ---
# "development" locally; set KOSHLY_ENVIRONMENT=production when deployed. Production
# (or any Cloud Run service) refuses the development code sender.
koshly.environment=${KOSHLY_ENVIRONMENT:development}
# log = print codes in this console (development only); twilio = real text messages;
# disabled = codes switched off (a deployed API before Twilio is set up).
koshly.codes.sender=${KOSHLY_CODE_SENDER:log}
# Limits against SMS pumping: codes per phone number per day (all users together),
# and texts per day for the whole API (a cap on the bill).
koshly.codes.sms-per-number-per-day=5
koshly.codes.sms-per-day=${KOSHLY_SMS_PER_DAY:500}
koshly.codes.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
koshly.codes.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
koshly.codes.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
